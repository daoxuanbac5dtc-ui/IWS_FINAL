spring.application.name=IWS_WebsiteSneaker
logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %yellow(%-5level) %red([%thread]) %blue(%logger{255}) - %msg%n}
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
server.port=8080

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/pro2113?characterEncoding=UTF-8}
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8



# ===== PROFILES =====
spring.profiles.active=local 

# ===== JACKSON CONFIGURATION =====
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== JPA LAZY LOADING CONFIGURATION =====
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ===== HIBERNATE LOGGING =====
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===== TRANSACTION CONFIGURATION =====
spring.transaction.default-timeout=30

# ===== CONNECTION POOL CONFIGURATION =====
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ===== SECURITY =====
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ===== JWT =====
jwt.secret=myVeryLongSecretKeyThatIsAtLeast256BitsLongForSecurityPurposesAndShouldBeKeptSecret
jwt.expiration=86400000 

# ===== FILE UPLOAD =====
app.upload.voucher.dir=voucher-images
# Email Configuration - S? d?ng bi?n môi tr??ng
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.default-encoding=UTF-8

# Forgot Password Settings
forgot.password.enabled=${FORGOT_PASSWORD_ENABLED:true}
forgot.password.otp.expiry.minutes=${OTP_EXPIRY_MINUTES:15}
app.upload.dir=uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.web.resources.cache.period=3600
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
